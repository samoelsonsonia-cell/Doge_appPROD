<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEAD V16.5 COMPLET</title><style>body{margin:0;background:#0e0e12;color:#fff;font-family:Arial}#L{position:fixed;inset:0;background:#0e0e12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}#A{display:none;flex-direction:column;min-height:100vh}.btn{background:#ffd400;color:#000;padding:14px;border-radius:10px;border:none;font-weight:bold;width:100%}.card{background:#1a1a22;border-radius:12px;padding:10px;margin:5px;border:1px solid #333}.tabs{display:flex;gap:5px;padding:8px;background:#000;overflow-x:auto;border-bottom:2px solid #ffd400}.tab{padding:8px 12px;border-radius:8px;background:#222;border:2px solid #444;font-weight:bold;font-size:11px;min-width:85px;text-align:center}.tab.on{background:#ffd400;color:#000}canvas{width:100%;height:140px;background:#000;border-radius:8px;border:1px solid #333}.top{display:flex;justify-content:space-between;padding:8px;background:#15151d;align-items:center}.drawer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000}.drawer.on{display:block}.box{width:85%;max-width:340px;height:100%;background:#15151d;padding:12px;overflow:auto}.inp{width:100%;background:#000;border:1px solid #444;border-radius:8px;padding:10px;color:#fff;margin-top:6px}</style><script>function go(){document.getElementById('L').style.display='none';document.getElementById('A').style.display='flex';setTimeout(init,300)}function od(i){document.getElementById('d-'+i).classList.add('on')}function cd(i){document.getElementById('d-'+i).classList.remove('on')}</script></head><body>
<div id="L"><div style="text-align:center;padding:30px"><div style="font-size:42px">💎</div><h3>TEAD V16.5 COMPLET</h3><p style="color:#0f0">30 COINS + KEY + WALLET + TRADE 1-4 + BOUGIE</p><button class="btn" onclick="go()">✅ CLIQUEZ ICI</button></div></div>
<div id="A"><div class="top"><button onclick="od('key')" style="background:#ffd400;color:#000;padding:6px 12px;border-radius:8px;border:none;font-weight:bold">☰ KEY</button><div style="text-align:center"><small>Solde: <b id="solde" style="color:#ffd400">-- $</b></small><br><small id="st" style="color:#0f0;font-size:10px">● FIX V16.5</small></div><button onclick="od('wallet')" style="background:#222;border:1px solid #444;color:#fff;padding:6px 10px;border-radius:8px">👛</button></div>
<div style="display:flex;gap:5px;padding:6px;background:#12121a"><input id="search" placeholder="🔍 DOGE, BTC, PEPE, BONK..." style="flex:1;background:#000;border:1px solid #444;border-radius:20px;padding:8px 12px;color:#fff" oninput="filt()"><button onclick="tog()" style="background:#ffd400;color:#000;border:none;padding:8px 12px;border-radius:20px;font-weight:bold">📋</button></div>
<div id="list" style="padding:4px;background:#12121a;max-height:70px;overflow-y:auto;display:flex;flex-wrap:wrap"></div>
<div class="tabs" id="tabs"></div>
<div style="flex:1;overflow-y:auto"><div class="card" style="border:2px solid #00c853;padding:6px"><div style="display:flex;justify-content:space-between"><b>📈 Bougie <span id="cc">DOGE</span></b><div><button onclick="setI('1')" style="background:#222;color:#fff;border:1px solid #444;padding:3px 8px;border-radius:6px;font-size:10px">1m</button><button onclick="setI('60')" style="background:#ffd400;color:#000;border:none;padding:3px 8px;border-radius:6px;font-size:10px">1H</button><button onclick="getK()" style="background:#00c853;color:#fff;border:none;padding:3px 8px;border-radius:6px;font-size:10px">🔄</button></div></div><canvas id="cv"></canvas><div style="display:flex;justify-content:space-between;font-size:10px;color:#888"><span id="o">O:--</span><span id="h">H:--</span><span id="l">L:--</span><span id="c">C:--</span></div></div>
<div class="card" style="border:2px solid #ffd400"><div style="display:flex;justify-content:space-between"><b id="tt">TRADE 1 - DOGE</b><span id="bd" style="background:#222;color:#888;padding:4px 10px;border-radius:20px;font-weight:bold">--%</span></div><div style="display:flex;justify-content:space-between;background:#000;padding:8px;border-radius:8px;margin:4px 0"><span>Prix nividianana:</span><b id="ep" style="color:#00c853">$0.00</b></div><div style="display:flex;justify-content:space-between;background:#000;padding:8px;border-radius:8px"><span>Prix LIVE:</span><b id="lp" style="color:#ffd400">$--</b></div><div id="pct" style="padding:10px;text-align:center;background:#222;border-radius:8px;font-weight:bold">Miandry LIVE...</div><div style="margin-top:8px"><small>Invest $:</small><input id="usd" type="number" value="1" style="width:100%;background:#000;border:2px solid #ffd400;border-radius:8px;padding:10px;color:#fff;text-align:center;font-weight:bold" onchange="saveU()"><div style="text-align:center;color:#ffd400;font-size:11px">= ~<span id="cv2">--</span> <span id="cc2">DOGE</span></div></div><div style="margin-top:6px;padding:8px;background:#000;border-radius:8px;border:1px dashed #ffd400"><label><input type="checkbox" id="auto"> 🔔 Auto Sell</label> + <input id="autop" type="number" value="1" style="width:45px;background:#222;color:#fff;border:1px solid #ffd400;border-radius:6px;text-align:center">% <button onclick="saveA()" style="background:#00c853;color:#fff;border:none;padding:4px 10px;border-radius:6px">OK</button></div><div style="display:flex;gap:8px;margin-top:8px"><button style="background:#00c853;color:#fff;padding:12px;border-radius:10px;border:none;font-weight:bold;flex:1" onclick="doT('Buy')">BUY</button><button style="background:#ff3d57;color:#fff;padding:12px;border-radius:10px;border:none;font-weight:bold;flex:1" onclick="doT('Sell')">SELL</button></div></div></div></div>

<div id="d-key" class="drawer" onclick="cd('key')"><div class="box" onclick="event.stopPropagation()"><h3>🔑 KEY SECRET</h3><input id="akey" placeholder="API KEY" class="inp"><input id="asec" placeholder="SECRET" type="password" class="inp"><button onclick="saveK()" class="btn" style="margin-top:8px">💾 TEHIRIZO</button><div style="margin-top:10px;background:#000;padding:8px;border-radius:8px"><small>Balance:</small><br><b id="fond2">--</b><br><button onclick="getBal()" style="background:#00c853;color:#fff;border:none;padding:6px 10px;border-radius:6px;margin-top:6px">🔄 Refresh Balance</button></div><br><button onclick="cd('key')" style="background:#222;color:#fff;padding:10px;width:100%;border-radius:8px;border:1px solid #444">FERMER</button></div></div>
<div id="d-wallet" class="drawer" onclick="cd('wallet')"><div class="box" style="margin-left:auto" onclick="event.stopPropagation()"><b>👛 WALLET</b><div class="card" style="margin-top:10px"><b id="fond">--</b></div><button onclick="cd('wallet')" style="background:#222;color:#fff;padding:10px;width:100%;border-radius:8px;border:1px solid #444;margin-top:10px">Fermer</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
let all=["DOGEUSDT","PEPEUSDT","BONKUSDT","SHIBUSDT","FLOKIUSDT","BNBUSDT","BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","LTCUSDT","DOTUSDT","TRXUSDT","UNIUSDT","NEARUSDT","SUIUSDT","OPUSDT","ARBUSDT","APTUSDT","FILUSDT","ETCUSDT","XLMUSDT","ATOMUSDT","INJUSDT","RENDERUSDT","FETUSDT","WIFUSDT"],fav=["DOGEUSDT","PEPEUSDT","BONKUSDT","BTCUSDT","ETHUSDT","SOLUSDT","SHIBUSDT","FLOKIUSDT"],prices={},trades=[],act=1,show=false,kline=[],kI='60',autoC=JSON.parse(localStorage.getItem('auto_cfg')||'{}'),ws=null;
function init(){try{let s=JSON.parse(localStorage.getItem('trades_cfg')||'null');if(s&&s.length===4)trades=s;else throw 0;}catch(e){trades=[{id:1,sym:"DOGEUSDT",usd:1,entry:0},{id:2,sym:"PEPEUSDT",usd:1,entry:0},{id:3,sym:"BTCUSDT",usd:1,entry:0},{id:4,sym:"SOLUSDT",usd:1,entry:0}];}act=parseInt(localStorage.getItem('act')||'1');build(fav);render();fetchP();getK();setInterval(fetchP,3000);setInterval(getK,12000);connect();}
function build(list){let h='';list.forEach(s=>{let n=s.replace('USDT','');let p=prices[s]?'$'+Number(prices[s]).toFixed(s.includes('BTC')||s.includes('ETH')?2:5):'...';h+=`<span onclick="pick('${s}')" style="display:inline-block;padding:5px 9px;margin:2px;border-radius:8px;background:#222;border:1px solid #444;font-size:11px;font-weight:bold">${n}<small style="display:block;font-size:8px;color:#0f0">${p}</small></span>`});document.getElementById('list').innerHTML=h;}
function filt(){let q=document.getElementById('search').value.toUpperCase().trim();if(!q){build(fav);return;}let f=all.filter(c=>c.includes(q));build(f.slice(0,20));}
function tog(){show=!show;build(show?all.slice(0,30):fav);}
function pick(sym){let t=trades.find(x=>x.id===act);t.sym=sym;localStorage.setItem('trades_cfg',JSON.stringify(trades));render();fetchP();getK();}
function render(){let h='';trades.forEach(t=>{let n=t.sym.replace('USDT','');let pr=prices[t.sym]||0;let d=t.entry&&pr?(pr-t.entry)/t.entry*100:0;h+=`<div class="tab ${t.id===act?'on':''}" onclick="setA(${t.id})">Trade${t.id}<br>${n}<br><small>${t.entry?d.toFixed(1)+'%':'--%'}</small></div>`});document.getElementById('tabs').innerHTML=h;let T=trades.find(x=>x.id===act);let name=T.sym.replace('USDT','');let pr=prices[T.sym]||0;document.getElementById('tt').innerText=`TRADE ${T.id} - ${name}`;document.getElementById('cc').innerText=name;document.getElementById('cc2').innerText=name;document.getElementById('ep').innerText=T.entry?'$'+T.entry.toFixed(6):'$0.00';document.getElementById('lp').innerText=pr?'$'+pr.toFixed(6):'$-- Chargement...';document.getElementById('usd').value=T.usd;document.getElementById('cv2').innerText=pr?(T.usd/pr).toFixed(4):'--';let cfg=autoC[T.sym]||{on:false,pct:1};document.getElementById('auto').checked=cfg.on;document.getElementById('autop').value=cfg.pct;let bd=document.getElementById('bd'),pc=document.getElementById('pct');if(T.entry&&pr){let d=(pr-T.entry)/T.entry*100;let du=(pr-T.entry)/T.entry*T.usd;bd.innerText=(d>=0?'+':'')+d.toFixed(2)+'%';bd.style.background=d>=0?'#00c853':'#ff3d57';bd.style.color='#fff';pc.innerHTML=d>=0?`↗ +${d.toFixed(2)}%<br>$${du.toFixed(4)}`:`↘ ${d.toFixed(2)}%<br>$${du.toFixed(4)}`;pc.style.background=d>=0?'#00c85322':'#ff3d5722';pc.style.border='2px solid '+(d>=0?'#00c853':'#ff3d57');pc.style.color=d>=0?'#00c853':'#ff3d57';}else{bd.innerText='--%';bd.style.background='#222';pc.innerHTML='Tsy mbola nividy';pc.style.background='#222';}}
function setA(id){act=id;localStorage.setItem('act',id);render();getK();}
function saveU(){let T=trades.find(x=>x.id===act);T.usd=parseFloat(document.getElementById('usd').value)||1;localStorage.setItem('trades_cfg',JSON.stringify(trades));render();}
function saveA(){let T=trades.find(x=>x.id===act);autoC[T.sym]={on:document.getElementById('auto').checked,pct:parseFloat(document.getElementById('autop').value)||1};localStorage.setItem('auto_cfg',JSON.stringify(autoC));alert('Auto '+T.sym+' '+(autoC[T.sym].on?'ON':'OFF'));}
function setI(i){kI=i;getK();}
async function fetchP(){try{let r=await fetch('https://api.bybit.com/v5/market/tickers?category=spot');let j=await r.json();if(j.result&&j.result.list){j.result.list.forEach(it=>{if(all.includes(it.symbol))prices[it.symbol]=parseFloat(it.lastPrice)});build(show?all.slice(0,30):fav);render();document.getElementById('st').innerText='● LIVE '+new Date().toLocaleTimeString()+' ✓';}}catch(e){}}
async function getK(){let T=trades.find(x=>x.id===act);if(!T)return;try{let r=await fetch(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${T.sym}&interval=${kI}&limit=50`);let j=await r.json();if(j.result&&j.result.list){kline=j.result.list.reverse();draw();let last=kline[kline.length-1];document.getElementById('o').innerText='O:'+parseFloat(last[1]).toFixed(5);document.getElementById('h').innerText='H:'+parseFloat(last[2]).toFixed(5);document.getElementById('l').innerText='L:'+parseFloat(last[3]).toFixed(5);document.getElementById('c').innerText='C:'+parseFloat(last[4]).toFixed(5);}}catch(e){}}
function draw(){let cv=document.getElementById('cv');if(!cv||!kline.length)return;let ctx=cv.getContext('2d'),W=cv.width=cv.offsetWidth*2,H=cv.height=cv.offsetHeight*2;ctx.clearRect(0,0,W,H);let hi=kline.map(k=>parseFloat(k[2])),lo=kline.map(k=>parseFloat(k[3])),max=Math.max(...hi),min=Math.min(...lo),range=max-min||max*0.01,pad=10,cw=(W-pad*2)/kline.length*0.7;kline.forEach((k,i)=>{let o=parseFloat(k[1]),h=parseFloat(k[2]),l=parseFloat(k[3]),c=parseFloat(k[4]),x=pad+i*(W-pad*2)/kline.length,yH=H-pad-((h-min)/range)*(H-pad*2),yL=H-pad-((l-min)/range)*(H-pad*2),yO=H-pad-((o-min)/range)*(H-pad*2),yC=H-pad-((c-min)/range)*(H-pad*2),up=c>=o;ctx.fillStyle=up?'#00c853':'#ff3d57';ctx.strokeStyle=ctx.fillStyle;ctx.beginPath();ctx.moveTo(x+cw/2,yH);ctx.lineTo(x+cw/2,yL);ctx.stroke();ctx.fillRect(x,Math.min(yO,yC),cw,Math.max(2,Math.abs(yO-yC)));});}
function saveK(){let k=document.getElementById('akey').value.trim(),s=document.getElementById('asec').value.trim();if(k)localStorage.setItem('bybit_key',k);if(s)localStorage.setItem('bybit_secret',s);alert('KEY voatahiry');cd('key');getBal();}
async function getBal(){let key=localStorage.getItem('bybit_key'),sec=localStorage.getItem('bybit_secret');if(!key||!sec)return;let ts=Date.now().toString(),rw="5000",param="accountType=UNIFIED",sign=CryptoJS.HmacSHA256(ts+key+rw+param,sec).toString();try{let r=await fetch('https://api.bybit.com/v5/account/wallet-balance?'+param,{headers:{"X-BAPI-API-KEY":key,"X-BAPI-SIGN":sign,"X-BAPI-TIMESTAMP":ts,"X-BAPI-RECV-WINDOW":rw}});let j=await r.json();if(j.result&&j.result.list){let list=j.result.list[0].coin,usdt=list.find(c=>c.coin==='USDT');document.getElementById('solde').innerText=usdt?parseFloat(usdt.walletBalance).toFixed(2)+' $':'--';let txt=list.filter(c=>parseFloat(c.walletBalance)>0).map(c=>c.coin+':'+parseFloat(c.walletBalance).toFixed(4)).join(' | ');document.getElementById('fond').innerText=txt||'0';document.getElementById('fond2').innerText=(usdt?usdt.walletBalance+' USDT\n':'')+txt;}}catch(e){}}
async function doT(side){let T=trades.find(x=>x.id===act);let pr=prices[T.sym];if(!pr){alert('Miandry LIVE...');return;}let key=localStorage.getItem('bybit_key'),sec=localStorage.getItem('bybit_secret');if(!key||!sec){od('key');return;}let bodyObj;if(side==='Buy'){bodyObj={category:"spot",symbol:T.sym,side:side,orderType:"Market",qty:T.usd.toString(),marketUnit:"quoteCoin"}}else{let coin=T.sym.replace('USDT','');let bal=null;try{let ts=Date.now().toString(),rw="5000",param="accountType=UNIFIED",sign=CryptoJS.HmacSHA256(ts+key+rw+param,sec).toString();let r=await fetch('https://api.bybit.com/v5/account/wallet-balance?'+param,{headers:{"X-BAPI-API-KEY":key,"X-BAPI-SIGN":sign,"X-BAPI-TIMESTAMP":ts,"X-BAPI-RECV-WINDOW":rw}});let j=await r.json();if(j.result)bal=j.result.list[0].coin.find(c=>c.coin===coin)}catch(e){}let real=bal?parseFloat(bal.walletBalance):0;if(real<=0){alert(coin+' tsy ampy');return;}let need=T.usd/pr;if(need>real)need=real;bodyObj={category:"spot",symbol:T.sym,side:side,orderType:"Market",qty:need.toFixed(6)}}let body=JSON.stringify(bodyObj);if(!confirm(side+' TRADE '+T.id+' '+T.sym+' '+bodyObj.qty+' @ $'+pr.toFixed(6)))return;let ts=Date.now().toString(),rw="5000",sign=CryptoJS.HmacSHA256(ts+key+rw+body,sec).toString();try{let res=await fetch('https://api.bybit.com/v5/order/create',{method:"POST",headers:{"X-BAPI-API-KEY":key,"X-BAPI-SIGN":sign,"X-BAPI-TIMESTAMP":ts,"X-BAPI-RECV-WINDOW":rw,"Content-Type":"application/json"},body:body});let j=await res.json();if(j.retCode===0){if(side==='Buy')T.entry=pr;else T.entry=0;localStorage.setItem('trades_cfg',JSON.stringify(trades));render();getK();getBal();}else alert('❌ '+j.retMsg)}catch(e){alert('CORS - Sokafy @ Bybit App Browser')}}
function connect(){let ws=new WebSocket('wss://stream.bybit.com/v5/public/spot');ws.onopen=()=>{ws.send(JSON.stringify({op:"subscribe",args:all.slice(0,10).map(s=>'tickers.'+s)}))};ws.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.data&&d.data.lastPrice){prices[d.data.symbol]=parseFloat(d.data.lastPrice);build(show?all.slice(0,30):fav);render();}}catch{}};ws.onclose=()=>setTimeout(connect,2000);}
</script></body></html>
