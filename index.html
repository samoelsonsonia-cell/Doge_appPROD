n></div></div><div style=text-align:right><small style=color:#aaa;font-size:8px>Prix</small><br><b id=nowP style=color:#ffd400;font-size:11px>$--</b><br><small id=nowD style=font-size:8px>--%</small></div></div><div style=display:flex;gap:8px;margin-top:10px><button id=bb style=background:#00c853;color:#fff;padding:14px;border-radius:8px;border:none;font-weight:700;flex:1 onclick="doTrade('Buy')">BUY</button><button id=bs style=background:#ff3d57;color:#fff;padding:14px;border-radius:8px;border:none;font-weight:700;flex:1 onclick="doTrade('Sell')">SELL</button></div></div></div></div><div id=d-k class=dr onclick="closeD('k')"><div class=bx onclick=event.stopPropagation()><h3>🔑 WALLET</h3><input id=ak placeholder="API KEY" class=i><input id=as placeholder="SECRET" type=password class=i><button onclick="saveKey()" style="background:#ffd400;color:#000;padding:10px;border-radius:8px;border:none;font-weight:700;width:100%;margin-top:8px">💾 SAVE</button><br><br><button onclick="closeD('k')" style="background:#222;color:#fff;padding:10px;width:100%;border-radius:8px;border:1px solid #444">⬅️ RETOUR</button></div></div><script src=https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js></script><script>let AL=["DOGEUSDT","PEPEUSDT","BONKUSDT","SHIBUSDT","FLOKIUSDT","BNBUSDT","BTCUSDT","ETHUSDT","SOLUSDT"],FAV=["DOGEUSDT","BTCUSDT","PEPEUSDT"],PR={},TR=[],AC=1,KL=[],TF='60',CFG=JSON.parse(localStorage.getItem('ac')||'{}'),HIS=JSON.parse(localStorage.getItem('hs')||'[]');function fmt(p){if(!p&&p!==0)return'--';p=Number(p);if(p>=1)return p.toFixed(4);if(p>=0.0001)return p.toFixed(6);if(p>=0.000001)return p.toFixed(8);return p.toFixed(10)}function startApp(){document.getElementById('L').style.display='none';document.getElementById('A').style.display='flex';init()}function openD(i){document.getElementById('d-'+i).classList.add('on')}function closeD(i){document.getElementById('d-'+i).classList.remove('on')}function init(){try{let s=JSON.parse(localStorage.getItem('tc'));if(s&&s.length==4)TR=s;else throw 0}catch(e){TR=[{id:1,sym:"DOGEUSDT",usd:1,en:0,hi:0,lo:0},{id:2,sym:"SOLUSDT",usd:1,en:0,hi:0,lo:0},{id:3,sym:"BTCUSDT",usd:1,en:0,hi:0,lo:0},{id:4,sym:"PEPEUSDT",usd:1,en:0,hi:0,lo:0}]}AC=parseInt(localStorage.getItem('acId')||'1');render();live();kline();setInterval(live,2500);setInterval(kline,10000)}function render(){let h='';TR.forEach(t=>{let n=t.sym.replace('USDT','');let pr=PR[t.sym]||0;let d=t.en&&pr?(pr-t.en)/t.en*100:0;h+=`<div class="tb ${t.id==AC?'on':''}" onclick="switchT(${t.id})"><div>T${t.id}</div><div>${n}</div><div style=font-size:9px;color:${d>=0?'#0f0':'#f55'}>${t.en?d.toFixed(1)+'%':'--'}</div></div>`});document.getElementById('tb').innerHTML=h;let Tt=TR.find(x=>x.id==AC);let nm=Tt.sym.replace('USDT','');let pr=PR[Tt.sym]||0;document.getElementById('sy').innerText=nm;document.getElementById('sy2').innerText=nm;document.getElementById('lb').innerText='T'+Tt.id;let ae=document.activeElement.id;if(ae!=='u')document.getElementById('u').value=Tt.usd;document.getElementById('lp').innerText=pr?'$'+fmt(pr):'$--';document.getElementById('qt').innerText=pr?(Tt.usd/pr).toFixed(0):'--';document.getElementById('nowP').innerText=pr?'$'+fmt(pr):'$--';if(Tt.en&&pr){if(!Tt.hi||pr>Tt.hi)Tt.hi=pr;if(!Tt.lo||pr<Tt.lo)Tt.lo=pr;localStorage.setItem('tc',JSON.stringify(TR))}let cfg=CFG[Tt.sym]||{buyOn:false,buyP:'',sellOn:false,sellPc:1};document.getElementById('auBuy').checked=cfg.buyOn||false;if(ae!=='abP')document.getElementById('abP').value=cfg.buyP||'';document.getElementById('auSell').checked=cfg.sellOn||false;if(ae!=='ap')document.getElementById('ap').value=cfg.sellPc||1;let one=document.getElementById('one'),no=document.getElementById('no'),bb=document.getElementById('bb'),bs=document.getElementById('bs'),nowD=document.getElementById('nowD');if(Tt.en&&pr){let d=(pr-Tt.en)/Tt.en*100;let tx=d>=0?`+${d.toFixed(2)}%`:`${d.toFixed(2)}%`;one.style.display='block';no.style.display='none';one.innerHTML=`$${fmt(Tt.en)} → <b style=color:${d>=0?'#0f0':'#f55'}>${tx}</b>`;bb.innerHTML=`BUY @ $${fmt(Tt.en)}`;bs.innerHTML=`SELL ${tx}`;nowD.innerText=tx;nowD.style.color=d>=0?'#0f0':'#f55'}else{one.style.display='none';no.style.display='block';no.innerText=pr?`LIVE $${fmt(pr)}`:'Miandry';bb.innerHTML='BUY REAL';bs.innerHTML='SELL REAL';nowD.innerText='LIVE'}}function switchT(id){AC=id;localStorage.setItem('acId',id);render();kline()}function saveAuto(){let Tt=TR.find(x=>x.id==AC);let bp=document.getElementById('abP').value.trim().replace(',','.');CFG[Tt.sym]={buyOn:document.getElementById('auBuy').checked,buyP:bp,sellOn:document.getElementById('auSell').checked,sellPc:parseFloat(document.getElementById('ap').value)||1};localStorage.setItem('ac',JSON.stringify(CFG));alert('AUTO '+Tt.sym+' BUY '+bp+' SELL '+CFG[Tt.sym].sellPc+'%');render()}async function live(){try{let r=await fetch('https://api.bybit.com/v5/market/tickers?category=spot');let j=await r.json();if(j.result&&j.result.list){j.result.list.forEach(it=>{if(AL.includes(it.symbol))PR[it.symbol]=parseFloat(it.lastPrice)});render();document.getElementById('s').innerText='● LIVE '+new Date().toLocaleTimeString();TR.forEach(t=>{let cfg=CFG[t.sym];if(!cfg)return;let pr=PR[t.sym];if(!pr)return;if(cfg.buyOn&&cfg.buyP&&!t.en){let bp=parseFloat(cfg.buyP);if(!isNaN(bp)&&pr<=bp){let o=AC;AC=t.id;doTrade('Buy');AC=o}}if(cfg.sellOn&&t.en){let d=(pr-t.en)/t.en*100;if(d>=cfg.sellPc){let o=AC;AC=t.id;doTrade('Sell');AC=o}}})}}catch(e){}}async function kline(){let Tt=TR.find(x=>x.id==AC);if(!Tt)return;try{let r=await fetch('https://api.bybit.com/v5/market/kline?category=spot&symbol='+Tt.sym+'&interval='+TF+'&limit=30');let j=await r.json();if(j.result&&j.result.list){KL=j.result.list.reverse();draw()}}catch(e){}}function draw(){let cv=document.getElementById('cv');if(!cv||!KL.length)return;let ctx=cv.getContext('2d'),W=cv.width=cv.offsetWidth*2,H=cv.height=cv.offsetHeight*2;ctx.clearRect(0,0,W,H);let hi=KL.map(k=>parseFloat(k[2])),lo=KL.map(k=>parseFloat(k[3])),max=Math.max(...hi),min=Math.min(...lo),rg=max-min||max*0.01,pad=10,step=(W-pad*2)/KL.length,cw=step*0.6;KL.forEach((k,i)=>{let o=parseFloat(k[1]),h=parseFloat(k[2]),l=parseFloat(k[3]),c=parseFloat(k[4]),x=pad+i*step,yH=H-pad-((h-min)/rg)*(H-pad*2),yL=H-pad-((l-min)/rg)*(H-pad*2),yO=H-pad-((o-min)/rg)*(H-pad*2),yC=H-pad-((c-min)/rg)*(H-pad*2),up=c>=o;ctx.fillStyle=up?'#00c853':'#ff3d57';ctx.strokeStyle=ctx.fillStyle;ctx.beginPath();ctx.moveTo(x+cw/2,yH);ctx.lineTo(x+cw/2,yL);ctx.stroke();ctx.fillRect(x,Math.min(yO,yC),cw,Math.max(2,Math.abs(yO-yC)))});let last=KL[KL.length-1];document.getElementById('o').innerText='O:'+fmt(last[1]);document.getElementById('h').innerText='H:'+fmt(last[2]);document.getElementById('l').innerText='L:'+fmt(last[3]);document.getElementById('c').innerText='C:'+fmt(last[4])}function saveKey(){let k=document.getElementById('ak').value.trim(),s=document.getElementById('as').value.trim();if(k)localStorage.setItem('bybit_key',k);if(s)localStorage.setItem('bybit_secret',s);alert('KEY OK');closeD('k')}async function doTrade(side){let Tt=TR.find(x=>x.id==AC);let pr=PR[Tt.sym];if(!pr){alert('LIVE...');return}let rawQty=Tt.usd/pr;let qtySell=Math.floor(rawQty).toString();let bObj=side=='Buy'?{category:"spot",symbol:Tt.sym,side:side,orderType:"Market",qty:Tt.usd.toString(),marketUnit:"quoteCoin"}:{category:"spot",symbol:Tt.sym,side:side,orderType:"Market",qty:qtySell};if(!confirm(side+' T'+Tt.id+' '+Tt.sym+' @ $'+fmt(pr)+'?'))return;Tt.en=side=='Buy'?pr:0;localStorage.setItem('tc',JSON.stringify(TR));render();alert('SIMUL '+side+' OK @ $'+fmt(pr))}</script></html>
