<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAD V10 ON/OFF RSI</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{box-sizing:border-box;margin:0}body{font-family:'Outfit',sans-serif;background:#070a0f;color:#fff}
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(circle at top,#1a2a1a,#070a0f)}
.btn-main{padding:16px 32px;border:none;border-radius:14px;background:#00ff88;color:#000;font-weight:900;cursor:pointer}
.app{display:none}.header{padding:8px;background:#10161d;border-bottom:1px solid #1e2d1e;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.tabs{display:flex;gap:3px;padding:6px;background:#0f151c;overflow:auto}
.tab{flex:1;padding:9px 4px;border-radius:9px;border:1px solid #253a26;background:#16211a;text-align:center;font-weight:700;color:#8da890;cursor:pointer;font-size:10px;min-width:50px}
.tab.active{background:#00ff88;color:#000}
.page{display:none;padding:8px}.page.active{display:block}
.card{background:#121b14;border:1px solid #1f3320;border-radius:12px;padding:10px;margin-bottom:8px}
.input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #29412b;background:#0a1210;color:#fff;margin-top:4px;font-size:12px}
.btn{width:100%;padding:12px;border:none;border-radius:11px;font-weight:900;cursor:pointer;margin-top:5px;font-size:12px}
.chartBox{width:100%;height:300px;background:#0a1210;border-radius:12px;border:1px solid #1f3320;overflow:hidden;margin-bottom:8px}
.box{background:#0a1210;border-radius:10px;padding:8px;text-align:center;border:1px solid #1f3320}
.signal{padding:8px;border-radius:8px;background:#1a251c;text-align:center;margin:5px 0;border:1px dashed #2a4a2d;font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#444}.dot.on{background:#00ff88;box-shadow:0 0 8px #00ff88}
.row{display:flex;gap:4px;align-items:center}
.modeSel{display:flex;gap:4px;margin:6px 0}.mode{flex:1;padding:8px;border-radius:9px;border:1px solid #333;background:#1a1a1a;text-align:center;font-size:10px;font-weight:700;cursor:pointer}.mode.active{background:#ffd700;color:#000}
.power{display:flex;gap:6px;margin:8px 0}.pbtn{flex:1;padding:14px;border-radius:12px;border:2px solid #333;font-weight:900;cursor:pointer;text-align:center;font-size:12px}.pbtn.on{background:#00ff88;color:#000;border-color:#00ff88;box-shadow:0 0 12px #00ff8855}.pbtn.off{background:#2a1a1a;color:#ff5555;border-color:#ff5555}
.rsiBox{display:flex;gap:4px;margin:6px 0}.rsi{flex:1;padding:8px;border-radius:9px;text-align:center;font-size:10px;font-weight:900}.rsi.high{background:#ff335522;border:1px solid #ff3355;color:#ff5555}.rsi.low{background:#00ff8822;border:1px solid #00ff88;color:#00ff88}.rsi.mid{background:#333;color:#aaa}
table{width:100%;font-size:9px;border-collapse:collapse}th,td{padding:5px;border-bottom:1px solid #1f3320;text-align:left}
</style>
</head>
<body>
<div id="welcome" class="welcome">
<h1>TEAD <span style="color:#00ff88">V10 ON/OFF</span></h1>
<p style="margin:10px 0 20px;color:#9bb0a0">3 ROBOT + BOUTON ON/OFF + RSI + HISTO + AUTO/MANUEL</p>
<button class="btn-main" onclick="startApp()">COMMENCER V10 →</button>
</div>

<div id="app" class="app">
<div class="header">
<div><b>TEAD V10</b> <span id="d1" class="dot"></span><span id="d2" class="dot"></span><span id="d3" class="dot"></span> <small id="st">OFF</small></div>
<div style="display:flex;gap:5px"><div class="live" id="lv1" style="color:#00ff88">DOGE --</div><div class="live" id="lv2" style="color:#00aaff">BTC --</div><div class="live" id="lv3" style="color:#ffaa00">BNB --</div></div>
</div>

<div style="padding:6px;background:#121a12">
<div class="modeSel">
<div class="mode active" id="modeAuto" onclick="setMode('auto')">🤖 AUTO</div>
<div class="mode" id="modeManuel" onclick="setMode('manuel')">👆 MANUEL + SONNERIE</div>
</div>
<small id="modeTxt" style="color:#ffd700;font-size:10px">Bouton ON/OFF isaky ny robot - maty @ batterie lany</small>
</div>

<div class="tabs">
<div class="tab active" id="t1" onclick="op(1)">R1</div>
<div class="tab" id="t2" onclick="op(2)">R2</div>
<div class="tab" id="t3" onclick="op(3)">R3</div>
<div class="tab" id="t4" onclick="op(4)">WALLET</div>
<div class="tab" id="t5" onclick="op(5)">HISTO</div>
</div>

<div id="p1" class="page active"></div>
<div id="p2" class="page"></div>
<div id="p3" class="page"></div>
<div id="p4" class="page"></div>
<div id="p5" class="page"></div>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
<script>
let MODE=localStorage.getItem('TEAD_MODE')||'auto';
let B={
1:{sym:'DOGEUSDT',tv:'BINANCE:DOGEUSDT',base:0.08859,curr:0,profit:0,fund:10,int:5,timer:null,dip:-1,pp:0.5,color:'#00ff88',name:'DOGE',alive:true,prices:[]},
2:{sym:'BTCUSDT',tv:'BINANCE:BTCUSDT',base:65000,curr:0,profit:0,fund:10,int:7,timer:null,dip:-1,pp:1,color:'#00aaff',name:'BTC',alive:true,prices:[]},
3:{sym:'BNBUSDT',tv:'BINANCE:BNBUSDT',base:600,curr:0,profit:0,fund:10,int:9,timer:null,dip:-1,pp:0.8,color:'#ffaa00',name:'BNB',alive:true,prices:[]}
};
let on=false,HIST=JSON.parse(localStorage.getItem('TEAD_HIST')||'[]');
let SAVED=JSON.parse(localStorage.getItem('TEAD_V10')||'{}');

function startApp(){document.getElementById('welcome').style.display='none';document.getElementById('app').style.display='block';
if(SAVED.b){Object.keys(SAVED.b).forEach(k=>{if(B[k]){B[k].base=SAVED.b[k].base;B[k].pp=SAVED.b[k].pp;B[k].dip=SAVED.b[k].dip;B[k].int=SAVED.b[k].int;B[k].alive=SAVED.b[k].alive!==false;}});}
build();applyMode();renderHist();[1,2,3].forEach(i=>loadChart(i));}

function save(){let o={b:{}};[1,2,3].forEach(i=>{o.b[i]={base:B[i].base,pp:B[i].pp,dip:B[i].dip,int:B[i].int,alive:B[i].alive}});localStorage.setItem('TEAD_V10',JSON.stringify(o));}

function op(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('p'+n).classList.add('active');document.getElementById('t'+n).classList.add('active');if(n<=3)setTimeout(()=>loadChart(n),300)}

function build(){
[1,2,3].forEach(i=>{
let b=B[i];
document.getElementById('p'+i).innerHTML=`
<div class="power">
<div class="pbtn ${b.alive?'on':'off'}" id="pbtn${i}" onclick="toggle(${i})">${b.alive?'🟢 ROBOT '+i+' VELONA - MAMPIASA':'🔴 ROBOT '+i+' MATY - BATTERIE LANY'}<br><small>${b.alive?'Tsindrio hamono':'Tsindrio hamelona - Tsy mila plan indray'}</small></div>
</div>
<div id="chart${i}" class="chartBox"></div>
<div class="rsiBox">
<div class="rsi mid" id="rsi${i}">RSI: --</div>
<div class="rsi mid" id="trend${i}">TREND: --</div>
<div class="rsi mid" id="sigRsi${i}">SIGNAL: --</div>
</div>
<div class="card">
<div class="row"><select id="coin${i}" onchange="chg(${i})" style="flex:1"><option value="${b.sym}" selected>${b.name}</option></select><input id="base${i}" class="input" type="number" value="${b.base}" style="flex:1;margin:0" oninput="upd(${i})"></div>
<div class="row"><div style="flex:1"><label>Dip %</label><input id="dip${i}" class="input" type="number" value="${b.dip}" step="0.1" oninput="upd(${i})"></div><div style="flex:1"><label>⏱️ s</label><div class="row"><input id="int${i}" class="input" type="number" value="${b.int}" min="1" max="60" style="margin:0"><button class="btn" style="width:50px;margin:0;background:${b.color};color:#000" onclick="setInt(${i})">SET</button></div></div></div>
<input id="sell${i}" class="input" readonly style="color:${b.color}">
<label>💰 Profit % ${b.name}</label><input id="prof${i}" type="range" min="0.01" max="5" step="0.01" value="${b.pp}" oninput="showP(${i})"><div class="row"><span id="ptxt${i}" style="color:${b.color};font-weight:900">${b.pp}%</span><span id="pmoney${i}" style="margin-left:auto">~${(b.fund*b.pp/100).toFixed(4)}$</span></div>
<div id="sig${i}" class="signal">${b.alive?'En attente bougie rouge':'🔴 ROBOT MATY - tsindrio VELONA'} </div>
<button id="claim${i}" class="btn" style="background:${b.color};color:#000" disabled onclick="claim(${i})">CLAIM R${i}</button>
</div>`;
upd(i);showP(i);
});
document.getElementById('p4').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><div class="box"><div>R1 <span id="st1" class="dot"></span></div><div id="pf1" style="color:#00ff88;font-weight:900">0.00$</div></div><div class="box"><div>R2 <span id="st2" class="dot"></span></div><div id="pf2" style="color:#00aaff;font-weight:900">0.00$</div></div><div class="box"><div>R3 <span id="st3" class="dot"></span></div><div id="pf3" style="color:#ffaa00;font-weight:900">0.00$</div></div></div><div class="box" style="margin-top:6px;border-color:#ffd700"><div>TOTAL</div><div id="tot" style="font-size:20px;color:#ffd700;font-weight:900">0.00 $</div></div><div class="card"><input id="apiK" class="input" placeholder="API KEY"><button class="btn" style="background:#00ff88;color:#000" onclick="onBot()">ACTIVER LIVE</button><small id="bInfo">OFF</small></div>`;
document.getElementById('p5').innerHTML=`<div class="card"><div class="row"><h4 style="flex:1">📜 HISTO</h4><button class="btn" style="width:70px;margin:0;background:#ffaa00;color:#000" onclick="clearH()">EFFACER</button></div><div style="max-height:300px;overflow:auto"><table><thead><tr><th>Heure</th><th>R</th><th>Coin</th><th>Prix</th><th>Profit</th><th>ON/OFF</th></tr></thead><tbody id="hb"></tbody></table></div></div>`;
updateDots();
}

function toggle(i){
B[i].alive=!B[i].alive;save();
let btn=document.getElementById('pbtn'+i);
if(B[i].alive){btn.className='pbtn on';btn.innerHTML='🟢 ROBOT '+i+' VELONA - MAMPIASA<br><small>Tsindrio hamono</small>';restart(i);fetchP(i);document.getElementById('sig'+i).textContent='En attente bougie rouge - VELONA';}
else{btn.className='pbtn off';btn.innerHTML='🔴 ROBOT '+i+' MATY - BATTERIE LANY<br><small>Tsindrio hamelona - plan voatahiry</small>';if(B[i].timer)clearInterval(B[i].timer);document.getElementById('sig'+i).innerHTML='🔴 MATY - Tsindrio VELONA hamerenana';document.getElementById('d'+i).classList.remove('on');}
updateDots();
}

function updateDots(){[1,2,3].forEach(i=>{let d=document.getElementById('d'+i);if(d){if(B[i].alive&&on)d.classList.add('on');else d.classList.remove('on');}let s=document.getElementById('st'+i);if(s){if(B[i].alive)s.className='dot on';else s.className='dot';}});}

function loadChart(i){let c=document.getElementById('chart'+i);if(!c)return;c.innerHTML='';new TradingView.widget({autosize:true,symbol:B[i].tv,interval:"1",timezone:"Etc/UTC",theme:"dark",style:"1",locale:"en",toolbar_bg:"#070a0f",container_id:"chart"+i,height:300});}
function setMode(m){MODE=m;localStorage.setItem('TEAD_MODE',m);applyMode()}
function applyMode(){document.getElementById('modeAuto').classList.toggle('active',MODE=='auto');document.getElementById('modeManuel').classList.toggle('active',MODE=='manuel');document.getElementById('modeTxt').textContent=MODE=='auto'?'AUTO: claim auto @ bougie rouge':'MANUEL: bougie rouge + sonnerie -> CLAIM manuel';}
function upd(i){B[i].base=parseFloat(document.getElementById('base'+i)?.value)||B[i].base;B[i].dip=parseFloat(document.getElementById('dip'+i)?.value)||-1;let s=B[i].base*(1+B[i].dip/100);let el=document.getElementById('sell'+i);if(el)el.value='Trigger '+s.toFixed(6)+' $ ('+B[i].dip+'%)';save();}
function showP(i){let v=parseFloat(document.getElementById('prof'+i)?.value);B[i].pp=v;let t=document.getElementById('ptxt'+i);if(t)t.textContent=v+'%';let m=document.getElementById('pmoney'+i);if(m)m.textContent='~'+(B[i].fund*v/100).toFixed(4)+'$';save();}
function chg(i){B[i].sym=document.getElementById('coin'+i).value;B[i].tv='BINANCE:'+B[i].sym;fetchP(i,true);loadChart(i)}
function setInt(i){B[i].int=parseInt(document.getElementById('int'+i).value);save();restart(i)}
function restart(i){if(B[i].timer)clearInterval(B[i].timer);if(!B[i].alive)return;B[i].timer=setInterval(()=>fetchP(i),B[i].int*1000)}
function onBot(){localStorage.setItem('TEAD_KEY','ok');on=true;[1,2,3].forEach(i=>{if(B[i].alive)restart(i);fetchP(i)});updateDots();document.getElementById('st').textContent='LIVE';document.getElementById('bInfo').textContent='LIVE 3R';}
if(localStorage.getItem('TEAD_KEY')){on=true;setTimeout(()=>{onBot()},800);}

function calcRSI(prices){
if(prices.length<15)return 50;
let gains=0,losses=0;
for(let i=prices.length-14;i<prices.length;i++){let d=prices[i]-prices[i-1];if(d>0)gains+=d;else losses+=-d;}
if(losses==0)return 100;
let rs=gains/losses;return 100-(100/(1+rs));
}

async function fetchP(i,force=false){
if(!B[i].alive)return;
let p=0,s=B[i].sym;
try{let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol='+s);let j=await r.json();if(j.price)p=parseFloat(j.price)}catch(e){}
if(!p)return;
B[i].curr=p;B[i].prices.push(p);if(B[i].prices.length>50)B[i].prices.shift();
let rsi=calcRSI(B[i].prices);
let lv=document.getElementById('lv'+i);if(lv)lv.textContent=B[i].name+' '+p.toFixed(p<1?6:2)+' $';
let rEl=document.getElementById('rsi'+i);if(rEl){rEl.textContent='RSI: '+rsi.toFixed(1);rEl.className='rsi '+(rsi>70?'high':rsi<30?'low':'mid');}
let tr=document.getElementById('trend'+i);if(tr){let trend=rsi>60?'HAUSSIER':rsi<40?'BAISSIER':'NEUTRE';tr.textContent='TREND: '+trend;tr.className='rsi '+(rsi>60?'high':rsi<40?'low':'mid');}
let sr=document.getElementById('sigRsi'+i);if(sr){let txt=rsi>70?'DIP IMMINENT - VELONA':rsi<30?'ACHAT FORT':rsi>60?'ATTENDRE DIP':'NEUTRE';sr.textContent=txt;sr.className='rsi '+(rsi>70?'high':rsi<30?'low':'mid');}
let diff=(p-B[i].base)/B[i].base*100;
if(force){B[i].base=p;let be=document.getElementById('base'+i);if(be)be.value=p.toFixed(6);upd(i)}
if(diff<=B[i].dip&&on&&B[i].alive){
let sig=document.getElementById('sig'+i);if(sig)sig.innerHTML='<b style="color:#ff3355">🔴 RSI '+rsi.toFixed(0)+' | DIP '+diff.toFixed(2)+'% - '+MODE.toUpperCase()+'</b>';
let btn=document.getElementById('claim'+i);if(btn){btn.disabled=false;btn.textContent=(MODE=='auto'?'🤖 AUTO R':'👆 MANUEL R')+i+' '+B[i].name+' RSI'+rsi.toFixed(0)+' +'+B[i].pp+'%';btn.style.boxShadow='0 0 18px '+B[i].color;}
try{document.getElementById('beep').play()}catch(e){}
if(MODE=='auto')claim(i);
}
}
function claim(i){
if(!B[i].alive)return;
let gain=B[i].fund*B[i].pp/100;B[i].profit+=gain;
let pf=document.getElementById('pf'+i);if(pf)pf.textContent=B[i].profit.toFixed(4)+' $';
let tot=B[1].profit+B[2].profit+B[3].profit;let t=document.getElementById('tot');if(t)t.textContent=tot.toFixed(4)+' $';
let rsi=calcRSI(B[i].prices);
let e={time:new Date().toLocaleTimeString(),r:'R'+i+(B[i].alive?' ON':' OFF'),coin:B[i].name+' RSI'+rsi.toFixed(0),price:B[i].curr.toFixed(6),profit:'+'+gain.toFixed(4)+'$ '+B[i].pp+'%',mode:MODE};
HIST.unshift(e);if(HIST.length>120)HIST.pop();localStorage.setItem('TEAD_HIST',JSON.stringify(HIST));renderHist();
B[i].base=B[i].curr;let be=document.getElementById('base'+i);if(be)be.value=B[i].curr.toFixed(6);upd(i);
let btn=document.getElementById('claim'+i);if(btn){btn.disabled=true;btn.textContent='CLAIMED - Waiting';btn.style.boxShadow='none';}
}
function renderHist(){let h='';HIST.forEach(r=>{h+=`<tr><td>${r.time}</td><td>${r.r}</td><td>${r.coin}</td><td>${r.price}</td><td style="color:#00ff88">${r.profit}</td><td>${r.mode}</td></tr>`});let b=document.getElementById('hb');if(b)b.innerHTML=h}
function clearH(){if(confirm('Effacer?')){HIST=[];localStorage.removeItem('TEAD_HIST');renderHist()}}
</script>
</body>
  </html>
