<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
let all=["DOGEUSDT","PEPEUSDT","BONKUSDT","SHIBUSDT","FLOKIUSDT","BNBUSDT","BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","LTCUSDT","DOTUSDT","TRXUSDT","UNIUSDT","NEARUSDT","SUIUSDT","OPUSDT","ARBUSDT","APTUSDT","FILUSDT","ETCUSDT","XLMUSDT","ATOMUSDT","INJUSDT","RENDERUSDT","FETUSDT","WIFUSDT"],fav=["DOGEUSDT","PEPEUSDT","BONKUSDT","BTCUSDT","ETHUSDT","SOLUSDT"],prices={},trades=[],act=1,show=false,kline=[],kI='60',autoC=JSON.parse(localStorage.getItem('auto_cfg')||'{}'),histo=JSON.parse(localStorage.getItem('histo_v16')||'[]'),curH=1;
function init(){try{let s=JSON.parse(localStorage.getItem('trades_cfg'));if(s&&s.length==4)trades=s;else throw 0;}catch(e){trades=[{id:1,sym:"DOGEUSDT",usd:1,entry:0,hi:0,lo:0,entryTime:0},{id:2,sym:"SOLUSDT",usd:1,entry:0,hi:0,lo:0,entryTime:0},{id:3,sym:"BTCUSDT",usd:1,entry:0,hi:0,lo:0,entryTime:0},{id:4,sym:"PEPEUSDT",usd:1,entry:0,hi:0,lo:0,entryTime:0}];}act=parseInt(localStorage.getItem('act')||'1');build(fav);render();fetchP();getK();setInterval(fetchP,3000);setInterval(getK,15000);}
function build(list){let h='';list.forEach(s=>{let n=s.replace('USDT','');let p=prices[s]?'$'+Number(prices[s]).toFixed(5):'...';h+=`<span class="coin" onclick="pick('${s}')">${n} <small style="color:#0f0">${p}</small></span>`});document.getElementById('list').innerHTML=h;}
function filt(){let q=document.getElementById('search').value.toUpperCase().trim();if(!q){build(fav);return;}let f=all.filter(c=>c.includes(q));build(f.slice(0,25));}
function tog(){show=!show;build(show?all:fav);}
function pick(sym){let t=trades.find(x=>x.id==act);t.sym=sym;t.hi=0;t.lo=0;localStorage.setItem('trades_cfg',JSON.stringify(trades));render();fetchP();getK();}
function render(){let h='';trades.forEach(t=>{let n=t.sym.replace('USDT','');let pr=prices[t.sym]||0;let d=t.entry&&pr?(pr-t.entry)/t.entry*100:0;h+=`<div class="tab ${t.id==act?'on':''}" onclick="setA(${t.id})"><div>T${t.id}</div><div>${n}</div><div style="font-size:10px;color:${d>=0?'#0f0':'#f55'}">${t.entry?d.toFixed(1)+'%':'--%'}</div></div>`});document.getElementById('tabs').innerHTML=h;
let T=trades.find(x=>x.id==act);let name=T.sym.replace('USDT','');let pr=prices[T.sym]||0;
document.getElementById('cc').innerText=name;document.getElementById('cc2').innerText=name;document.getElementById('cl').innerText='T'+T.id;document.getElementById('tt').innerText='TRADE '+T.id+' - '+name;document.getElementById('hs').innerText=name;document.getElementById('ht').innerText='TRADE '+T.id;document.getElementById('ds').innerText=name;
document.getElementById('usd').value=T.usd;document.getElementById('qty').innerText=pr?(T.usd/pr).toFixed(3):'--';
if(T.entry&&pr){if(!T.hi||pr>T.hi)T.hi=pr;if(!T.lo||pr<T.lo)T.lo=pr;localStorage.setItem('trades_cfg',JSON.stringify(trades));}
let cfg=autoC[T.sym]||{on:false,pct:1};document.getElementById('auto').checked=cfg.on;document.getElementById('autop').value=cfg.pct;
let bd=document.getElementById('bd'),one=document.getElementById('oneLine'),noT=document.getElementById('noTrade');
if(T.entry&&pr){
let d=(pr-T.entry)/T.entry*100;let du=(pr-T.entry)/T.entry*T.usd;
bd.innerText=(d>=0?'+':'')+d.toFixed(2)+'%';bd.style.background=d>=0?'#00c853':'#ff3d57';bd.style.color='#fff';
// SORATRA 1 IHANY - % NIAKATRA/NIDINA TAMIN' PRIX NIVIDIANANA
one.style.display='block';noT.style.display='none';
let txt=d>=0?`+${d.toFixed(2)}% niakatra`:`${d.toFixed(2)}% nidina`;
one.innerHTML=`Nividy $${T.entry.toFixed(5)} → <b style="color:${d>=0?'#00c853':'#ff3d57'}">${txt}</b> = $${du>=0?'+':''}${du.toFixed(4)}`;
one.style.background=d>=0?'#00c85322':'#ff3d5722';one.style.borderColor=d>=0?'#00c853':'#ff3d57';
if(cfg.on&&d>=cfg.pct){one.innerHTML+=`<br><small style="color:#ffd400">🚀 AUTO ${cfg.pct}%!</small>`;doT('Sell');autoC[T.sym].on=false;localStorage.setItem('auto_cfg',JSON.stringify(autoC));}
}else{bd.innerText='--%';bd.style.background='#222';one.style.display='none';noT.style.display='block';}
renderH();
}
function renderH(){let T=trades.find(x=>x.id==act);let list=histo.filter(h=>h.tradeId==T.id).slice(-20).reverse();let html=list.length?list.map(h=>`<div class="hi ${h.side=='BUY'?'buy':'sell'}"><b>${h.side} T${h.tradeId} ${h.sym.replace('USDT','')}</b> @ $${h.price.toFixed(5)} | ${h.pnl?h.pnl.toFixed(2)+'%':''}<br><small>${new Date(h.time).toLocaleString()}</small></div>`).join(''):`<div style="text-align:center;padding:15px;color:#888">📭 T${T.id} ${T.sym.replace('USDT','')} - Tsy misy</div>`;document.getElementById('hMini').innerHTML=html;if(curH)showH(curH);}
function showH(id){curH=id;for(let i=1;i<=4;i++){let b=document.getElementById('b'+i);if(b){b.style.background=i==id?'#ffd400':'#222';b.style.color=i==id?'#000':'#fff';}}let T=trades.find(x=>x.id==id);let list=histo.filter(h=>h.tradeId==id).slice(-30).reverse();let html=list.length?list.map(h=>`<div class="hi"><b>${h.side} T${h.tradeId}</b> @ $${h.price.toFixed(5)}<br><small>${new Date(h.time).toLocaleString()}</small></div>`).join(''):`<div style="text-align:center;color:#888;padding:20px">T${id} - Tsy misy</div>`;document.getElementById('hFull').innerHTML=`<div style="background:#ffd400;color:#000;padding:6px;border-radius:6px;text-align:center;font-weight:bold;margin-bottom:6px">HISTO T${id} ${T.sym.replace('USDT','')}</div>`+html;}
function setA(id){act=id;localStorage.setItem('act',id);render();getK();window.scrollTo({top:0,behavior:'smooth'});}
function saveU(){let T=trades.find(x=>x.id==act);T.usd=parseFloat(document.getElementById('usd').value)||1;localStorage.setItem('trades_cfg',JSON.stringify(trades));render();}
function saveA(){let T=trades.find(x=>x.id==act);autoC[T.sym]={on:document.getElementById('auto').checked,pct:parseFloat(document.getElementById('autop').value)||1};localStorage.setItem('auto_cfg',JSON.stringify(autoC));alert('🔔 Auto '+T.sym+' '+(autoC[T.sym].on?'ON':'OFF')+' '+autoC[T.sym].pct+'%');}
function setI(i){kI=i;getK();}
async function fetchP(){try{let r=await fetch('https://api.bybit.com/v5/market/tickers?category=spot');let j=await r.json();if(j.result&&j.result.list){j.result.list.forEach(it=>{if(all.includes(it.symbol))prices[it.symbol]=parseFloat(it.lastPrice)});build(show?all:fav);render();document.getElementById('status').innerText='● LIVE '+new Date().toLocaleTimeString();}}catch(e){}}
async function getK(){let T=trades.find(x=>x.id==act);if(!T)return;try{let r=await fetch(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${T.sym}&interval=${kI}&limit=50`);let j=await r.json();if(j.result&&j.result.list){kline=j.result.list.reverse();draw();}}catch(e){}}
function draw(){let cv=document.getElementById('cv');if(!cv||!kline.length)return;let ctx=cv.getContext('2d'),W=cv.width=cv.offsetWidth*2,H=cv.height=cv.offsetHeight*2;ctx.clearRect(0,0,W,H);let hi=kline.map(k=>parseFloat(k[2])),lo=kline.map(k=>parseFloat(k[3])),max=Math.max(...hi),min=Math.min(...lo),range=max-min||max*0.01,pad=10,cw=(W-pad*2)/kline.length*0.65;kline.forEach((k,i)=>{let o=parseFloat(k[1]),h=parseFloat(k[2]),l=parseFloat(k[3]),c=parseFloat(k[4]),x=pad+i*(W-pad*2)/kline.length,yH=H-pad-((h-min)/range)*(H-pad*2),yL=H-pad-((l-min)/range)*(H-pad*2),yO=H-pad-((o-min)/range)*(H-pad*2),yC=H-pad-((c-min)/range)*(H-pad*2),up=c>=o;ctx.fillStyle=up?'#00c853':'#ff3d57';ctx.strokeStyle=ctx.fillStyle;ctx.beginPath();ctx.moveTo(x+cw/2,yH);ctx.lineTo(x+cw/2,yL);ctx.stroke();ctx.fillRect(x,Math.min(yO,yC),cw,Math.max(2,Math.abs(yO-yC)));});}
function saveK(){let k=document.getElementById('akey').value.trim(),s=document.getElementById('asec').value.trim();if(k)localStorage.setItem('bybit_key',k);if(s)localStorage.setItem('bybit_secret',s);alert('KEY voatahiry');cd('key');getB();}
async function getB(){let key=localStorage.getItem('bybit_key'),sec=localStorage.getItem('bybit_secret');if(!key||!sec)return;let ts=Date.now().toString(),rw="5000",param="accountType=UNIFIED",sign=CryptoJS.HmacSHA256(ts+key+rw+param,sec).toString();try{let r=await fetch('https://api.bybit.com/v5/account/wallet-balance?'+param,{headers:{"X-BAPI-API-KEY":key,"X-BAPI-SIGN":sign,"X-BAPI-TIMESTAMP":ts,"X-BAPI-RECV-WINDOW":rw}});let j=await r.json();if(j.result&&j.result.list){let list=j.result.list[0].coin,usdt=list.find(c=>c.coin==='USDT');document.getElementById('solde').innerText=usdt?parseFloat(usdt.walletBalance).toFixed(2)+' $':'--';document.getElementById('bal').innerText=list.filter(c=>parseFloat(c.walletBalance)>0).map(c=>c.coin+':'+parseFloat(c.walletBalance).toFixed(4)).join(' | ');}}catch(e){}}
function clearH(){let T=trades.find(x=>x.id==act);if(confirm('Fafao HISTO T'+T.id+'?')){histo=histo.filter(h=>h.tradeId!=T.id);localStorage.setItem('histo_v16',JSON.stringify(histo));renderH();}}
async function doT(side){let T=trades.find(x=>x.id==act);let pr=prices[T.sym];if(!pr){alert('Miandry LIVE...');return;}let key=localStorage.getItem('bybit_key'),sec=localStorage.getItem('bybit_secret');if(!key||!sec){od('key');return;}let bodyObj=side=='Buy'?{category:"spot",symbol:T.sym,side:side,orderType:"Market",qty:T.usd.toString(),marketUnit:"quoteCoin"}:{category:"spot",symbol:T.sym,side:side,orderType:"Market",qty:(T.usd/pr).toFixed(6)};if(!confirm(side+' REAL T'+T.id+' '+T.sym+' @ $'+pr.toFixed(5)+'?'))return;let body=JSON.stringify(bodyObj),ts=Date.now().toString(),rw="5000",sign=CryptoJS.HmacSHA256(ts+key+rw+body,sec).toString();try{let res=await fetch('https://api.bybit.com/v5/order/create',{method:"POST",headers:{"X-BAPI-API-KEY":key,"X-BAPI-SIGN":sign,"X-BAPI-TIMESTAMP":ts,"X-BAPI-RECV-WINDOW":rw,"Content-Type":"application/json"},body:body});let j=await res.json();if(j.retCode==0){if(side=='Buy'){T.entry=pr;T.hi=pr;T.lo=pr;T.entryTime=Date.now();histo.push({time:Date.now(),tradeId:T.id,sym:T.sym,side:'BUY',price:pr,usd:T.usd,entry:pr,pnl:0,pnlUsd:0});}else{let pnl=T.entry?(pr-T.entry)/T.entry*100:0;let pnlUsd=T.entry?(pr-T.entry)/T.entry*T.usd:0;histo.push({time:Date.now(),tradeId:T.id,sym:T.sym,side:'SELL',price:pr,usd:T.usd,entry:T.entry,pnl:pnl,pnlUsd:pnlUsd});T.entry=0;T.hi=0;T.lo=0;T.entryTime=0;}localStorage.setItem('histo_v16',JSON.stringify(histo));localStorage.setItem('trades_cfg',JSON.stringify(trades));render();getK();getB();}else alert('❌ '+j.retMsg)}catch(e){alert('CORS - @ Bybit App');}}
</script></body></html>
