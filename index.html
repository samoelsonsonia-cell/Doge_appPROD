ff3d57;color:#fff;border:none;padding:8px;border-radius:6px;flex:1;font-size:11px>🗑️</button><button onclick="openD('h')" style=background:#222;color:#fff;border:1px solid #444;padding:8px;border-radius:6px;flex:1">📜 4 HISTO</button></div></div></div></div><div id=d-k class=dr onclick="closeD('k')"><div class=bx onclick=event.stopPropagation()><h3>🔑 WALLET</h3><input id=ak placeholder="API KEY" class=i><input id=as placeholder="SECRET" type=password class=i><button onclick="saveKey()" style="background:#ffd400;color:#000;padding:10px;border-radius:8px;border:none;font-weight:700;width:100%;margin-top:8px">💾 SAVE</button><div style=margin-top:10px;background:#000;padding:8px;border-radius:8px><b id=bU style=color:#ffd400>-- USDT</b><br><small id=bL style=color:#aaa></small><br><button onclick="loadW()" style=background:#00c853;color:#fff;border:none;padding:6px;border-radius:6px;width:100%;margin-top:6px>🔄 WALLET</button></div><br><button onclick="closeD('k')" style="background:#222;color:#fff;padding:10px;width:100%;border-radius:8px;border:1px solid #444">⬅️ RETOUR</button></div></div><div id=d-h class=dr onclick="closeD('h')"><div class=bx onclick=event.stopPropagation()><div style=display:flex;justify-content:space-between><b>📜 4 HISTO</b><button onclick="closeD('h')" style=background:#ffd400;color:#000;border:none;padding:6px 10px;border-radius:6px;font-weight:700>⬅️</button></div><div style=display:flex;gap:4px;margin:8px 0><button onclick="showH(1)" id=h1 style="background:#ffd400;color:#000;padding:6px;border-radius:6px;border:none;flex:1;font-weight:700">T1</button><button onclick="showH(2)" id=h2 style="background:#222;color:#fff;padding:6px;border-radius:6px;border:1px solid #444;flex:1">T2</button><button onclick="showH(3)" id=h3 style="background:#222;color:#fff;padding:6px;border-radius:6px;border:1px solid #444;flex:1">T3</button><button onclick="showH(4)" id=h4 style="background:#222;color:#fff;padding:6px;border-radius:6px;border:1px solid #444;flex:1">T4</button></div><div id=hf style="max-height:60vh;overflow-y:auto;background:#000;border-radius:8px;padding:5px;border:1px solid #333"></div><br><button onclick="closeD('h')" style="background:#222;color:#fff;padding:10px;width:100%;border-radius:8px;border:1px solid #444">⬅️ RETOUR</button></div></div><script src=https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js></script><script>
let AL=["DOGEUSDT","PEPEUSDT","BONKUSDT","SHIBUSDT","FLOKIUSDT","BNBUSDT","BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","LTCUSDT","DOTUSDT","TRXUSDT","UNIUSDT","NEARUSDT","SUIUSDT","OPUSDT","WIFUSDT"],FAV=["DOGEUSDT","BTCUSDT","ETHUSDT","SOLUSDT","PEPEUSDT","BONKUSDT","DOTUSDT"],PR={},TR=[],AC=1,SA=!1,KL=[],TF='60',CFG=JSON.parse(localStorage.getItem('ac')||'{}'),HIS=JSON.parse(localStorage.getItem('hs')||'[]'),CH=1;
function fmt(p){if(!p&&p!==0)return'--';p=Number(p);if(p>=1000)return p.toFixed(2);if(p>=1)return p.toFixed(4);if(p>=0.01)return p.toFixed(5);if(p>=0.0001)return p.toFixed(6);if(p>=0.000001)return p.toFixed(8);return p.toFixed(10)}
function startApp(){document.getElementById('L').style.display='none';document.getElementById('A').style.display='flex';init()}
function openD(i){document.getElementById('d-'+i).classList.add('on')}function closeD(i){document.getElementById('d-'+i).classList.remove('on')}
function init(){try{let s=JSON.parse(localStorage.getItem('tc'));if(s&&s.length==4)TR=s;else throw 0}catch(e){TR=[{id:1,sym:"DOGEUSDT",usd:1,en:0,hi:0,lo:0},{id:2,sym:"SOLUSDT",usd:1,en:0,hi:0,lo:0},{id:3,sym:"BTCUSDT",usd:1,en:0,hi:0,lo:0},{id:4,sym:"PEPEUSDT",usd:1,en:0,hi:0,lo:0}]}AC=parseInt(localStorage.getItem('acId')||'1');buildC(FAV);render();live();kline();setInterval(live,2500);setInterval(kline,10000);loadW()}
function buildC(ls){let h='';ls.forEach(s=>{let n=s.replace('USDT','');let pr=PR[s]?fmt(PR[s]):'--';h+=`<span class=co onclick="chooseC('${s}')">${n} <b style=color:#0f0>$${pr}</b></span>`});document.getElementById('lc').innerHTML=h}
function filterC(){let q=document.getElementById('q').value.toUpperCase().trim();if(!q){buildC(FAV);return}let f=AL.filter(c=>c.includes(q));buildC(f.slice(0,20))}function toggleC(){SA=!SA;buildC(SA?AL:FAV)}function chooseC(sym){let t=TR.find(x=>x.id==AC);t.sym=sym;t.hi=0;t.lo=0;localStorage.setItem('tc',JSON.stringify(TR));render();live();kline()}
function render(){let h='';TR.forEach(t=>{let n=t.sym.replace('USDT','');let pr=PR[t.sym]||0;let d=t.en&&pr?(pr-t.en)/t.en*100:0;h+=`<div class="tb ${t.id==AC?'on':''}" onclick="switchT(${t.id})"><div>T${t.id}</div><div>${n}</div><div style=font-size:9px;color:${d>=0?'#0f0':'#f55'}>${t.en?d.toFixed(1)+'%':'--'}</div></div>`});document.getElementById('tb').innerHTML=h;let Tt=TR.find(x=>x.id==AC);let nm=Tt.sym.replace('USDT','');let pr=PR[Tt.sym]||0;document.getElementById('sy').innerText=nm;document.getElementById('sy2').innerText=nm;document.getElementById('lb').innerText='T'+Tt.id;document.getElementById('hs').innerText=nm;document.getElementById('ht').innerText=Tt.id;if(document.activeElement.id!=='u') document.getElementById('u').value=Tt.usd;document.getElementById('lp').innerText=pr?'$'+fmt(pr):'$--';document.getElementById('qt').innerText=pr?(Tt.usd/pr).toFixed(2):'--';document.getElementById('nowP').innerText=pr?'$'+fmt(pr):'$--';if(Tt.en&&pr){if(!Tt.hi||pr>Tt.hi)Tt.hi=pr;if(!Tt.lo||pr<Tt.lo)Tt.lo=pr;localStorage.setItem('tc',JSON.stringify(TR))}let cfg=CFG[Tt.sym]||{buyOn:false,buyP:'',sellOn:false,sellPc:1};document.getElementById('auBuy').checked=cfg.buyOn||false;document.getElementById('abP').value=cfg.buyP||'';document.getElementById('auSell').checked=cfg.sellOn||false;document.getElementById('ap').value=cfg.sellPc||1;let one=document.getElementById('one'),no=document.getElementById('no'),bb=document.getElementById('bb'),bs=document.getElementById('bs'),nowD=document.getElementById('nowD');if(Tt.en&&pr){let d=(pr-Tt.en)/Tt.en*100;let du=(pr-Tt.en)/Tt.en*Tt.usd;let tx=d>=0?`+${d.toFixed(2)}%`:`${d.toFixed(2)}%`;one.style.display='block';no.style.display='none';one.innerHTML=`$${fmt(Tt.en)} → <b style=color:${d>=0?'#0f0':'#f55'}>${tx}</b> = $${du>=0?'+':''}${du.toFixed(4)}<br><small>Hi $${fmt(Tt.hi)} Lo $${fmt(Tt.lo)}</small>`;one.style.background=d>=0?'#00c85322':'#ff3d5722';bb.innerHTML=`BUY @ $${fmt(Tt.en)}`;bb.style.background='#444';bs.innerHTML=`SELL ${d>=0?'+':''}${d.toFixed(2)}%`;nowD.innerText=tx;nowD.style.color=d>=0?'#0f0':'#f55'}else{one.style.display='none';no.style.display='block';no.innerText=pr?`LIVE $${fmt(pr)}`:'Miandry';bb.innerHTML='BUY REAL';bb.style.background='#00c853';bs.innerHTML='SELL REAL';nowD.innerText=pr?'LIVE':'--%';nowD.style.color='#888'}renderH()}
function renderH(){let Tt=TR.find(x=>x.id==AC);let ls=HIS.filter(h=>h.tid==Tt.id).slice(-20).reverse();let htm=ls.length?ls.map(h=>`<div style=padding:6px;margin:4px 0;border-radius:6px;background:#1a1a22;border-left:3px solid ${h.side=='BUY'?'#0f0':'#f55'};font-size:11px><b>${h.side} T${h.tid} ${h.sym.replace('USDT','')} @ $${fmt(h.pr)}</b> ${h.pnl?'<b style=color:'+(h.pnl>=0?'#0f0':'#f55')+'>'+(h.pnl>=0?'+':'')+h.pnl.toFixed(2)+'%</b>':''}<br><small>${new Date(h.tm).toLocaleString()}</small></div>`).join(''):`<div style=text-align:center;color:#888;padding:15px>📭 T${Tt.id} ${Tt.sym.replace('USDT','')}</div>`;document.getElementById('hm').innerHTML=htm;if(CH)showH(CH)}
function showH(id){CH=id;for(let i=1;i<=4;i++){let b=document.getElementById('h'+i);if(b){b.style.background=i==id?'#ffd400':'#222';b.style.color=i==id?'#000':'#fff'}}let Tt=TR.find(x=>x.id==id);let ls=HIS.filter(h=>h.tid==id).slice(-25).reverse();let htm=ls.length?ls.map(h=>`<div style=padding:6px;margin:4px 0;background:#1a1a22;border-radius:6px;font-size:11px><b>${h.side} @ $${fmt(h.pr)}</b> ${h.pnl?h.pnl.toFixed(1)+'%':''}<br><small>${new Date(h.tm).toLocaleString()}</small></div>`).join(''):`<div style=text-align:center;color:#888;padding:10px>Tsy misy</div>`;document.getElementById('hf').innerHTML=`<div style=background:#ffd400;color:#000;padding:5px;border-radius:5px;text-align:center;font-weight:700;margin-bottom:5px>T${id} ${Tt.sym.replace('USDT','')}</div>`+htm}
function switchT(id){AC=id;localStorage.setItem('acId',id);render();kline();window.scrollTo({top:0,behavior:'smooth'})}
function setI(t){TF=t;kline()}function saveAuto(){let Tt=TR.find(x=>x.id==AC);CFG[Tt.sym]={buyOn:document.getElementById('auBuy').checked,buyP:document.getElementById('abP').value.trim(),sellOn:document.getElementById('auSell').checked,sellPc:parseFloat(document.getElementById('ap').value)||1};localStorage.setItem('ac',JSON.stringify(CFG));alert('AUTO '+Tt.sym+' BUY '+(CFG[Tt.sym].buyOn?CFG[Tt.sym].buyP:'OFF')+' SELL '+CFG[Tt.sym].sellPc+'%')}
function clearH(){let Tt=TR.find(x=>x.id==AC);if(confirm('Fafao HISTO T'+Tt.id+'?')){HIS=HIS.filter(h=>h.tid!=Tt.id);localStorage.setItem('hs',JSON.stringify(HIS));renderH()}}
async function live(){try{let r=await fetch('https://api.bybit.com/v5/market/tickers?category=spot');let j=await r.json();if(j.result&&j.result.list){j.result.list.forEach(it=>{if(AL.includes(it.symbol))PR[it.symbol]=parseFloat(it.lastPrice)});buildC(SA?AL:FAV);render();document.getElementById('s').innerText='● LIVE '+new Date().toLocaleTimeString();TR.forEach(t=>{let cfg=CFG[t.sym];if(!cfg)return;let pr=PR[t.sym];if(!pr)return;if(cfg.buyOn&&cfg.buyP&&!t.en){if(pr<=parseFloat(cfg.buyP)){let o=AC;AC=t.id;doTrade('Buy');AC=o}}if(cfg.sellOn&&t.en){let d=(pr-t.en)/t.en*100;if(d>=cfg.sellPc){let o=AC;AC=t.id;doTrade('Sell');AC=o}}})}}catch(e){document.getElementById('s').innerText='● LIVE ERR'}}
async function kline(){let Tt=TR.find(x=>x.id==AC);if(!Tt)return;try{let r=await fetch('https://api.bybit.com/v5/market/kline?category=spot&symbol='+Tt.sym+'&interval='+TF+'&limit=30');let j=await r.json();if(j.result&&j.result.list){KL=j.result.list.reverse();draw()}}catch(e){}}
function draw(){let cv=document.getElementById('cv');if(!cv||!KL.length)return;let ctx=cv.getContext('2d'),W=cv.width=cv.offsetWidth*2,H=cv.height=cv.offsetHeight*2;ctx.clearRect(0,0,W,H);let hi=KL.map(k=>parseFloat(k[2])),lo=KL.map(k=>parseFloat(k[3])),max=Math.max(...hi),min=Math.min(...lo),rg=max-min||max*0.01,pad=10,step=(W-pad*2)/KL.length,cw=step*0.6;KL.forEach((k,i)=>{let o=parseFloat(k[1]),h=parseFloat(k[2]),l=parseFloat(k[3]),c=parseFloat(k[4]),x=pad+i*step,yH=H-pad-((h-min)/rg)*(H-pad*2),yL=H-pad-((l-min)/rg)*(H-pad*2),yO=H-pad-((o-min)/rg)*(H-pad*2),yC=H-pad-((c-min)/rg)*(H-pad*2),up=c>=o;ctx.fillStyle=up?'#00c853':'#ff3d57';ctx.strokeStyle=ctx.fillStyle;ctx.beginPath();ctx.moveTo(x+cw/2,yH);ctx.lineTo(x+cw/2,yL);ctx.stroke();ctx.fillRect(x,Math.min(yO,yC),cw,Math.max(2,Math.abs(yO-yC)))});let last=KL[KL.length-1];document.getElementById('o').innerText='O:'+fmt(last[1]);document.getElementById('h').innerText='H:'+fmt(last[2]);document.getElementById('l').innerText='L:'+fmt(last[3]);document.getElementById('c').innerText='C:'+fmt(last[4])}
function saveKey(){let k=document.getElementById('ak').value.trim(),s=document.getElementById('as').value.trim();if(k)localStorage.setItem('bybit_key',k);if(s)localStorage.setItem('bybit_secret',s);alert('KEY OK');closeD('k');loadW()}
async function loadW(){let key=localStorage.getItem('bybit_key'),sec=localStorage.getItem('bybit_secret');if(!key||!sec){document.getElementById('w').innerText='-- $ WALLET';return}let ts=Date.now().toString(),rw="5000",par="accountType=UNIFIED",sg=CryptoJS.HmacSHA256(ts+key+rw+par,sec).toString();try{let r=await fetch('https://api.bybit.com/v5/account/wallet-balance?'+par,{headers:{"X-BAPI-API-KEY":key,"X-BAPI-SIGN":sg,"X-BAPI-TIMESTAMP":ts,"X-BAPI-RECV-WINDOW":rw}});let j=await r.json();if(j.result&&j.result.list){let cs=j.result.list[0].coin,us=cs.find(c=>c.coin=='USDT');let b=us?parseFloat(us.walletBalance).toFixed(2):'0';document.getElementById('w').innerText=b+' $ WALLET REAL';document.getElementById('bU').innerText=b+' USDT';document.getElementById('bL').innerText=cs.filter(c=>parseFloat(c.walletBalance)>0).map(c=>c.coin+':'+fmt(c.walletBalance)).join(' | ')}}catch(e){document.getElementById('w').innerText='WALLET ERR'}}
async function doTrade(side){let Tt=TR.find(x=>x.id==AC);let pr=PR[Tt.sym];if(!pr){alert('LIVE...');return}let key=localStorage.getItem('bybit_key'),sec=localStorage.getItem('bybit_secret');if(!key||!sec){openD('k');return}let rawQty=Tt.usd/pr;let meme=["DOGEUSDT","PEPEUSDT","BONKUSDT","SHIBUSDT","FLOKIUSDT","WIFUSDT"];let qtySell=meme.includes(Tt.sym)?Math.floor(rawQty).toString():rawQty.toFixed(5);if(parseFloat(qtySell)<=0){alert('Invest kely!');return}let bObj=side=='Buy'?{category:"spot",symbol:Tt.sym,side:side,orderType:"Market",qty:Tt.usd.toString(),marketUnit:"quoteCoin"}:{category:"spot",symbol:Tt.sym,side:side,orderType:"Market",qty:qtySell};if(side!='Buy'||!CFG[Tt.sym]?.buyOn){if(!confirm(side+' T'+Tt.id+' '+Tt.sym+' '+(side=='Buy'?Tt.usd:qtySell)+' @ $'+fmt(pr)+'?'))return;}let bd=JSON.stringify(bObj),ts=Date.now().toString(),rw="5000",sg=CryptoJS.HmacSHA256(ts+key+rw+bd,sec).toString();try{let r=await fetch('https://api.bybit.com/v5/order/create',{method:"POST",headers:{"X-BAPI-API-KEY":key,"X-BAPI-SIGN":sg,"X-BAPI-TIMESTAMP":ts,"X-BAPI-RECV-WINDOW":rw,"Content-Type":"application/json"},body:bd});let j=await r.json();if(j.retCode==0){if(side=='Buy'){Tt.en=pr;Tt.hi=pr;Tt.lo=pr;HIS.push({tm:Date.now(),tid:Tt.id,sym:Tt.sym,side:'BUY',pr:pr})}else{let pnl=Tt.en?(pr-Tt.en)/Tt.en*100:0;HIS.push({tm:Date.now(),tid:Tt.id,sym:Tt.sym,side:'SELL',pr:pr,pnl:pnl});Tt.en=0;Tt.hi=0;Tt.lo=0}localStorage.setItem('hs',JSON.stringify(HIS));localStorage.setItem('tc',JSON.stringify(TR));render();kline();loadW()}else alert(j.retMsg)}catch(e){alert('CORS - Bybit App!')}}
</script></html>
